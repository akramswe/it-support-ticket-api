openapi: 3.0.3
info:
  title: IT Support Ticket API
  version: 1.0.0
  description: Local development/portfolio API; authentication is not implemented.
servers:
  - url: http://localhost:8000
paths:
  /health:
    get:
      summary: Liveness check
      responses:
        '200':
          description: Process is running
  /ready:
    get:
      summary: Database readiness check
      responses:
        '200':
          description: Database is reachable
        '500':
          $ref: '#/components/responses/InternalError'
  /api/tickets:
    post:
      summary: Create a new support ticket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTicket'
      responses:
        '201':
          description: Ticket created
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
    get:
      summary: List tickets with optional filters and pagination
      parameters:
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/TicketStatus'
        - in: query
          name: priority
          schema:
            $ref: '#/components/schemas/TicketPriority'
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            maximum: 10000
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Paginated tickets
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Ticket'
                  pagination:
                    type: object
                    required: [page, limit, total, totalPages]
                    properties:
                      page:
                        type: integer
                      limit:
                        type: integer
                      total:
                        type: integer
                      totalPages:
                        type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/tickets/{id}:
    parameters:
      - in: path
        name: id
        required: true
        description: Ticket UUID
        schema:
          type: string
          format: uuid
    get:
      summary: Retrieve one ticket
      responses:
        '200':
          description: Ticket details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Change ticket status and/or priority
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTicket'
      responses:
        '200':
          description: Updated ticket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
    delete:
      summary: Delete a ticket
      responses:
        '204':
          description: Ticket deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  schemas:
    TicketStatus:
      type: string
      enum: [open, in_progress, resolved]
    TicketPriority:
      type: string
      enum: [low, medium, high]
    Ticket:
      type: object
      required: [id, title, description, status, priority, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/TicketStatus'
        priority:
          $ref: '#/components/schemas/TicketPriority'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TicketResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Ticket'
    CreateTicket:
      type: object
      required: [title]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 120
        description:
          type: string
          maxLength: 2000
          nullable: true
        priority:
          $ref: '#/components/schemas/TicketPriority'
    UpdateTicket:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        status:
          $ref: '#/components/schemas/TicketStatus'
        priority:
          $ref: '#/components/schemas/TicketPriority'
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Ticket or route not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedMediaType:
      description: Content-Type is not JSON
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Database unavailable or unexpected error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
